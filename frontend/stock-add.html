<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Stock Item</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="./log.css" rel="stylesheet">
</head>
<body>

<div class="container py-5" style="max-width: 500px;">
    <h2 class="mb-4">Add Stock Item</h2>

    <form id="stock-form">
        <div class="mb-3">
            <label class="form-label">Product Name</label>
            <input type="text" class="form-control" name="product_name" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Serial Number</label>
            <input type="text" class="form-control" name="serial_number" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Brand</label>
            <input type="text" class="form-control" name="brand" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Stock Quantity</label>
            <input type="number" min="0" class="form-control" name="stock" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Cost</label>
            <input type="number" min="0" step="0.01" class="form-control" name="cost" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Owner</label>
            <input type="text" class="form-control" name="owner" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Location</label>
            <input type="text" class="form-control" name="location">
        </div>
        <div class="mb-3">
            <label class="form-label">Vendor</label>
            <select class="form-select" name="vendor" id="vendor-select">
                <option value="">Loading vendors...</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Added By</label>
            <select class="form-select" name="users_id" id="user-select" required>
                <option value="">Loading users...</option>
            </select>
        </div>

        <div id="form-msg" class="mb-3"></div>

        <button type="submit" class="btn btn-primary">Save Item</button>
    </form>
</div>

<script>
async function loadVendors() {
    const select = document.getElementById('vendor-select');
    try {
        const res = await fetch('/vendors');
        const data = await res.json();
        select.innerHTML = '<option value="">— None —</option>';
        data.forEach(v => {
            const opt = document.createElement('option');
            opt.value = v.vendor_id;
            opt.textContent = v.name;
            select.appendChild(opt);
        });
    } catch {
        select.innerHTML = '<option value="">Could not load vendors</option>';
    }
}

async function loadUsers() {
    const select = document.getElementById('user-select');
    try {
        const res = await fetch('/users');
        const data = await res.json();
        select.innerHTML = '<option value="">Select a user</option>';
        data.forEach(u => {
            const opt = document.createElement('option');
            opt.value = u.users_id;
            opt.textContent = u.name;
            select.appendChild(opt);
        });
    } catch {
        select.innerHTML = '<option value="">Could not load users</option>';
    }
}

loadVendors();
loadUsers();

document.getElementById('stock-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    const msg = document.getElementById('form-msg');

    const payload = {
        product_name: form.product_name.value,
        serial_number: form.serial_number.value,
        brand: form.brand.value,
        stock: Number(form.stock.value),
        cost: Number(form.cost.value),
        owner: form.owner.value,
        location: form.location.value,
        vendor: form.vendor.value || null,
        users_id: Number(form.users_id.value)
    };

    try {
        const res = await fetch('/stock', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (!res.ok) {
            msg.innerHTML = `<div class="alert alert-danger">${data.error}</div>`;
            return;
        }

        msg.innerHTML = `<div class="alert alert-success">Item added successfully</div>`;
        form.reset();
    } catch {
        msg.innerHTML = `<div class="alert alert-danger">Could not reach the server</div>`;
    }
});
</script>

</body>
</html>
