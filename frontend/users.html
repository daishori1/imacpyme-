<!DOCTYPE html>
<html lang="en">
<head>
    <script src="./theme.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users — Fireasset</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="./log.css" rel="stylesheet">
</head>
<body>

<div class="d-flex">

    <!-- Sidebar -->
    <div class="bg-dark text-white vh-100 p-3 d-flex flex-column" style="width: 240px;">
        <h4 class="mb-4"><a href="/main.html " class="bi bi-fire text-warning me-1"></a>Fireasset</h4>

        <div class="accordion accordion-flush" id="sidebarAccordion">

            <div class="accordion-item bg-dark border-0">
                <h2 class="accordion-header">
                    <button class="accordion-button bg-dark text-white collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseStock">
                        <i class="bi bi-box-seam me-2"></i>Stock
                    </button>
                </h2>
                <div id="collapseStock" class="accordion-collapse collapse" data-bs-parent="#sidebarAccordion">
                    <div class="accordion-body p-0">
                        <a href="/stock.html" class="d-block text-white-50 px-3 py-2 text-decoration-none sidebar-link">Ver tabla</a>
                        <a href="/stock-add.html" class="d-block text-white-50 px-3 py-2 text-decoration-none sidebar-link">Agregar</a>
                    </div>
                </div>
            </div>

            <div class="accordion-item bg-dark border-0">
                <h2 class="accordion-header">
                    <button class="accordion-button bg-dark text-white collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseVendors">
                        <i class="bi bi-truck me-2"></i>Vendors
                    </button>
                </h2>
                <div id="collapseVendors" class="accordion-collapse collapse" data-bs-parent="#sidebarAccordion">
                    <div class="accordion-body p-0">
                        <a href="/vendors.html" class="d-block text-white-50 px-3 py-2 text-decoration-none sidebar-link">Ver tabla</a>
                        <a href="/vendors-add.html" class="d-block text-white-50 px-3 py-2 text-decoration-none sidebar-link">Agregar</a>
                    </div>
                </div>
            </div>

            <div class="accordion-item bg-dark border-0">
                <h2 class="accordion-header">
                    <button class="accordion-button bg-dark text-white collapsed active-section" type="button" data-bs-toggle="collapse" data-bs-target="#collapseUsers">
                        <i class="bi bi-people me-2"></i>Users
                    </button>
                </h2>
                <div id="collapseUsers" class="accordion-collapse collapse show" data-bs-parent="#sidebarAccordion">
                    <div class="accordion-body p-0">
                        <a href="/users.html" class="d-block text-white-50 px-3 py-2 text-decoration-none sidebar-link">Ver tabla</a>
                        <a href="/users-add.html" class="d-block text-white-50 px-3 py-2 text-decoration-none sidebar-link">Agregar</a>
                    </div>
                </div>
            </div>

        </div>

        <div class="mt-auto pt-3 border-top border-secondary">
    <button class="btn btn-outline-light btn-sm w-100 mb-2" onclick="toggleTheme()">
        <i id="theme-toggle-icon" class="bi bi-moon-stars-fill me-1"></i> Toggle Theme
    </button>
    <button class="btn btn-outline-light btn-sm w-100 mb-2" data-bs-toggle="modal" data-bs-target="#profileModal">
        <i class="bi bi-person-circle me-1"></i> View Profile
    </button>
    <a href="/auth/logout" class="btn btn-outline-danger btn-sm w-100">
        <i class="bi bi-box-arrow-right me-1"></i> Log Out
    </a>
</div>
    </div>

    <!-- Main content -->
    <div class="flex-grow-1 p-4 bg-light" style="min-height: 100vh;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="mb-0"><i class="bi bi-people me-2 text-primary"></i>Users</h2>
            <a href="/users-add.html" class="btn btn-primary">
                <i class="bi bi-plus-lg me-1"></i>Add User
            </a>
        </div>

        <div class="card shadow-sm border-0 mb-3">
            <div class="card-body py-3">
                <div class="row g-2">
                    <div class="col-md-3">
                        <input type="text" id="f-id" class="form-control form-control-sm" placeholder="Filter by ID...">
                    </div>
                    <div class="col-md-4">
                        <input type="text" id="f-name" class="form-control form-control-sm" placeholder="Filter by name...">
                    </div>
                    <div class="col-md-4">
                        <input type="text" id="f-email" class="form-control form-control-sm" placeholder="Filter by email...">
                    </div>
                    <div class="col-md-1">
                        <button id="f-clear" class="btn btn-sm btn-outline-secondary w-100">Clear</button>
                    </div>
                </div>
            </div>
        </div>

        <p class="text-muted small" id="row-count"></p>

        <div class="card shadow-sm border-0">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover mb-0">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Rol</th>
                                <th>Active</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-body">
                            <tr><td colspan="5" class="text-center">Cargando...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

</div>

<!-- Profile Modal -->
<div class="modal fade" id="profileModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">User Profile</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p><strong>Name:</strong> <span id="profile-name">—</span></p>
                <p><strong>Email:</strong> <span id="profile-email">—</span></p>
                <p class="mb-0"><strong>Role:</strong> <span id="profile-rol">—</span></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.getElementById('profileModal').addEventListener('show.bs.modal', () => {
    fetch('/api/me')
        .then(res => res.json())
        .then(user => {
            document.getElementById('profile-name').textContent = user.name;
            document.getElementById('profile-email').textContent = user.email;
            document.getElementById('profile-rol').textContent = user.rol;
        })
        .catch(() => {
            document.getElementById('profile-name').textContent = 'Error loading profile';
        });
});
</script>

<script>
let allUsers = [];

function displayRow(row) {
    const tr = document.createElement('tr');
    tr.dataset.id = row.users_id;
    tr.innerHTML = `
        <td>${row.users_id}</td>
        <td>${row.name}</td>
        <td>${row.email}</td>
        <td>${row.rol}</td>
        <td>
            <div class="form-check form-switch mb-0">
                <input type="checkbox" class="form-check-input toggle-active" ${row.active ? 'checked' : ''}>
            </div>
        </td>
    `;
    return tr;
}

function renderTable(data) {
    const tbody = document.getElementById('tabla-body');
    tbody.innerHTML = '';
    document.getElementById('row-count').textContent = `Showing ${data.length} users`;

    if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-muted">
            <i class="bi bi-inbox fs-1 d-block mb-2"></i>No users found
        </td></tr>`;
        return;
    }

    data.forEach(row => tbody.appendChild(displayRow(row)));
}

function applyFilters() {
    const idF = document.getElementById('f-id').value.toLowerCase();
    const nameF = document.getElementById('f-name').value.toLowerCase();
    const emailF = document.getElementById('f-email').value.toLowerCase();

    const filtered = allUsers.filter(r => {
        if (idF && !String(r.users_id).includes(idF)) return false;
        if (nameF && !r.name.toLowerCase().includes(nameF)) return false;
        if (emailF && !r.email.toLowerCase().includes(emailF)) return false;
        return true;
    });

    renderTable(filtered);
}

['f-id','f-name','f-email'].forEach(id => {
    document.getElementById(id).addEventListener('input', applyFilters);
});

document.getElementById('f-clear').addEventListener('click', () => {
    document.querySelectorAll('.card input[type="text"]').forEach(i => i.value = '');
    renderTable(allUsers);
});

document.getElementById('tabla-body').addEventListener('change', async (e) => {
    if (!e.target.classList.contains('toggle-active')) return;
    const tr = e.target.closest('tr');
    const id = tr.dataset.id;
    const active = e.target.checked;

    try {
        const res = await fetch(`/users/${id}/active`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ active })
        });
        if (!res.ok) {
            alert('Could not update status');
            e.target.checked = !active;
        }
    } catch {
        alert('Could not reach the server');
        e.target.checked = !active;
    }
});

async function loadUsers() {
    try {
        const res = await fetch('/users');
        allUsers = await res.json();
        applyFilters();
    } catch {
        document.getElementById('tabla-body').innerHTML =
            '<tr><td colspan="5" class="text-center text-danger">Error al cargar datos</td></tr>';
    }
}

loadUsers();
</script>

</body>
</html>
