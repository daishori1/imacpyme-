<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Vendor — Fireasset</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="./log.css" rel="stylesheet">
</head>
<body>

<div class="d-flex">

    <!-- Sidebar -->
    <div class="bg-dark text-white vh-100 p-3 d-flex flex-column" style="width: 240px;">
        <h4 class="mb-4"><i class="bi bi-fire text-warning me-1"></i>Fireasset</h4>

        <div class="accordion accordion-flush" id="sidebarAccordion">

            <div class="accordion-item bg-dark border-0">
                <h2 class="accordion-header">
                    <button class="accordion-button bg-dark text-white collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseStock">
                        <i class="bi bi-box-seam me-2"></i>Stock
                    </button>
                </h2>
                <div id="collapseStock" class="accordion-collapse collapse" data-bs-parent="#sidebarAccordion">
                    <div class="accordion-body p-0">
                        <a href="/stock.html" class="d-block text-white-50 px-3 py-2 text-decoration-none sidebar-link">Ver tabla</a>
                        <a href="/stock-add.html" class="d-block text-white-50 px-3 py-2 text-decoration-none sidebar-link">Agregar</a>
                    </div>
                </div>
            </div>

            <div class="accordion-item bg-dark border-0">
                <h2 class="accordion-header">
                    <button class="accordion-button bg-dark text-white collapsed active-section" type="button" data-bs-toggle="collapse" data-bs-target="#collapseVendors">
                        <i class="bi bi-truck me-2"></i>Vendors
                    </button>
                </h2>
                <div id="collapseVendors" class="accordion-collapse collapse show" data-bs-parent="#sidebarAccordion">
                    <div class="accordion-body p-0">
                        <a href="/vendors.html" class="d-block text-white-50 px-3 py-2 text-decoration-none sidebar-link">Ver tabla</a>
                        <a href="/vendors-add.html" class="d-block text-white-50 px-3 py-2 text-decoration-none sidebar-link">Agregar</a>
                    </div>
                </div>
            </div>

            <div class="accordion-item bg-dark border-0">
                <h2 class="accordion-header">
                    <button class="accordion-button bg-dark text-white collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseUsers">
                        <i class="bi bi-people me-2"></i>Users
                    </button>
                </h2>
                <div id="collapseUsers" class="accordion-collapse collapse" data-bs-parent="#sidebarAccordion">
                    <div class="accordion-body p-0">
                        <a href="/users.html" class="d-block text-white-50 px-3 py-2 text-decoration-none sidebar-link">Ver tabla</a>
                        <a href="/users-add.html" class="d-block text-white-50 px-3 py-2 text-decoration-none sidebar-link">Agregar</a>
                    </div>
                </div>
            </div>

        </div>

        <div class="mt-auto pt-3 border-top border-secondary">
            <button class="btn btn-outline-light btn-sm w-100 mb-2" data-bs-toggle="modal" data-bs-target="#profileModal">
                <i class="bi bi-person-circle me-1"></i> View Profile
            </button>
            <a href="/auth/logout" class="btn btn-outline-danger btn-sm w-100">
                <i class="bi bi-box-arrow-right me-1"></i> Log Out
            </a>
        </div>
    </div>

    <!-- Main content -->
    <div class="flex-grow-1 p-4 bg-light" style="min-height: 100vh;">
        <div style="max-width: 500px;">
            <h2 class="mb-4"><i class="bi bi-truck me-2 text-primary"></i>Add Vendor</h2>

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <form id="vendor-form">
                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input type="text" class="form-control" name="name" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" name="email" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Phone</label>
                            <input type="text" class="form-control" name="phone">
                        </div>
                        <div class="form-check form-switch mb-4">
                            <input type="checkbox" class="form-check-input" id="active" name="active">
                            <label class="form-check-label" for="active">Active</label>
                        </div>

                        <div id="form-msg" class="mb-3"></div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-lg me-1"></i>Save Vendor
                            </button>
                            <a href="/vendors.html" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</div>

<!-- Profile Modal -->
<div class="modal fade" id="profileModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">User Profile</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p><strong>Name:</strong> <span id="profile-name">—</span></p>
                <p><strong>Email:</strong> <span id="profile-email">—</span></p>
                <p class="mb-0"><strong>Role:</strong> <span id="profile-rol">—</span></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.getElementById('profileModal').addEventListener('show.bs.modal', () => {
    fetch('/api/me')
        .then(res => res.json())
        .then(user => {
            document.getElementById('profile-name').textContent = user.name;
            document.getElementById('profile-email').textContent = user.email;
            document.getElementById('profile-rol').textContent = user.rol;
        })
        .catch(() => {
            document.getElementById('profile-name').textContent = 'Error loading profile';
        });
});
</script>

<script>
document.getElementById('vendor-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    const msg = document.getElementById('form-msg');

    const payload = {
        name: form.name.value,
        email: form.email.value,
        phone: form.phone.value,
        active: form.active.checked
    };

    try {
        const res = await fetch('/vendors', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (!res.ok) {
            msg.innerHTML = `<div class="alert alert-danger">${data.error}</div>`;
            return;
        }

        msg.innerHTML = `<div class="alert alert-success">Vendor added successfully. Redirecting...</div>`;
        form.reset();
        setTimeout(() => { window.location.href = '/vendors.html'; }, 1500);
    } catch {
        msg.innerHTML = `<div class="alert alert-danger">Could not reach the server</div>`;
    }
});
</script>

</body>
</html>
