<!DOCTYPE html>
<html lang="en">
<head>
    <script src="./theme.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock — Fireasset</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="./log.css" rel="stylesheet">
</head>
<body>

<div class="d-flex">

    <!-- Sidebar -->
    <div class="bg-dark text-white vh-100 p-3 d-flex flex-column" style="width: 240px;">
        <h4 class="mb-4"><a href="/main.html"    class="bi bi-fire text-warning me-1"></a>Fireasset</h4>

        <div class="accordion accordion-flush" id="sidebarAccordion">

            <div class="accordion-item bg-dark border-0">
                <h2 class="accordion-header">
                    <button class="accordion-button bg-dark text-white collapsed active-section" type="button" data-bs-toggle="collapse" data-bs-target="#collapseStock">
                        <i class="bi bi-box-seam me-2"></i>Stock
                    </button>
                </h2>
                <div id="collapseStock" class="accordion-collapse collapse show" data-bs-parent="#sidebarAccordion">
                    <div class="accordion-body p-0">
                        <a href="/stock.html" class="d-block text-white-50 px-3 py-2 text-decoration-none sidebar-link">View table</a>
                        <a href="/stock-add.html" class="d-block text-white-50 px-3 py-2 text-decoration-none sidebar-link">Add</a>
                    </div>
                </div>
            </div>

            <div class="accordion-item bg-dark border-0">
                <h2 class="accordion-header">
                    <button class="accordion-button bg-dark text-white collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseVendors">
                        <i class="bi bi-truck me-2"></i>Vendors
                    </button>
                </h2>
                <div id="collapseVendors" class="accordion-collapse collapse" data-bs-parent="#sidebarAccordion">
                    <div class="accordion-body p-0">
                        <a href="/vendors.html" class="d-block text-white-50 px-3 py-2 text-decoration-none sidebar-link">View table</a>
                        <a href="/vendors-add.html" class="d-block text-white-50 px-3 py-2 text-decoration-none sidebar-link">Add</a>
                    </div>
                </div>
            </div>

            <div class="accordion-item bg-dark border-0">
                <h2 class="accordion-header">
                    <button class="accordion-button bg-dark text-white collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseUsers">
                        <i class="bi bi-people me-2"></i>Users
                    </button>
                </h2>
                <div id="collapseUsers" class="accordion-collapse collapse" data-bs-parent="#sidebarAccordion">
                    <div class="accordion-body p-0">
                        <a href="/users.html" class="d-block text-white-50 px-3 py-2 text-decoration-none sidebar-link">View table</a>
                        <a href="/users-add.html" class="d-block text-white-50 px-3 py-2 text-decoration-none sidebar-link">Add</a>
                    </div>
                </div>
            </div>

        </div>

        <div class="mt-auto pt-3 border-top border-secondary">
    <button class="btn btn-outline-light btn-sm w-100 mb-2" onclick="toggleTheme()">
        <i id="theme-toggle-icon" class="bi bi-moon-stars-fill me-1"></i> Toggle Theme
    </button>
    <button class="btn btn-outline-light btn-sm w-100 mb-2" data-bs-toggle="modal" data-bs-target="#profileModal">
        <i class="bi bi-person-circle me-1"></i> View Profile
    </button>
    <a href="/auth/logout" class="btn btn-outline-danger btn-sm w-100">
        <i class="bi bi-box-arrow-right me-1"></i> Log Out
    </a>
</div>
    </div>

    <!-- Main content -->
    <div class="flex-grow-1 p-4 bg-light" style="min-height: 100vh;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0"><i class="bi bi-box-seam me-2 text-primary"></i>Stock</h2>
        <a href="/stock-add.html" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i>Add Item
        </a>
    </div>

    <div class="card shadow-sm border-0 mb-3">
        <div class="card-body py-3">
            <div class="row g-2">
                <div class="col-md-3">
                    <input type="text" id="f-product" class="form-control form-control-sm" placeholder="Filter by product...">
                </div>
                <div class="col-md-2">
                    <input type="text" id="f-vendor" class="form-control form-control-sm" placeholder="Filter by vendor...">
                </div>
                <div class="col-md-2">
                    <input type="text" id="f-owner" class="form-control form-control-sm" placeholder="Filter by owner...">
                </div>
                <div class="col-md-2 d-flex gap-1">
                    <input type="number" id="f-stock-min" class="form-control form-control-sm" placeholder="Qty min">
                    <input type="number" id="f-stock-max" class="form-control form-control-sm" placeholder="Qty max">
                </div>
                <div class="col-md-2 d-flex gap-1">
                    <input type="number" id="f-cost-min" class="form-control form-control-sm" placeholder="Cost min">
                    <input type="number" id="f-cost-max" class="form-control form-control-sm" placeholder="Cost max">
                </div>
                <div class="col-md-1">
                    <button id="f-clear" class="btn btn-sm btn-outline-secondary w-100">Clear</button>
                </div>
            </div>
        </div>
    </div>

    <p class="text-muted small" id="row-count"></p>

    <div class="card shadow-sm border-0">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover mb-0">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Product Name</th>
                            <th>Serial Number</th>
                            <th>Brand</th>
                            <th>Stock</th>
                            <th>Min</th>
                            <th>Max</th>
                            <th>Cost</th>
                            <th>Owner</th>
                            <th>Vendor</th>
                            <th>Location</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-body">
                        <tr><td colspan="12" class="text-center">Cargando...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Profile Modal -->
<div class="modal fade" id="profileModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">User Profile</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p><strong>Name:</strong> <span id="profile-name">—</span></p>
                <p><strong>Email:</strong> <span id="profile-email">—</span></p>
                <p class="mb-0"><strong>Role:</strong> <span id="profile-rol">—</span></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.getElementById('profileModal').addEventListener('show.bs.modal', () => {
    fetch('/api/me')
        .then(res => res.json())
        .then(user => {
            document.getElementById('profile-name').textContent = user.name;
            document.getElementById('profile-email').textContent = user.email;
            document.getElementById('profile-rol').textContent = user.rol;
        })
        .catch(() => {
            document.getElementById('profile-name').textContent = 'Error loading profile';
        });
});
</script>

<script>
let allStock = [];

function displayRow(row) {
    const stock = Number(row.stock);
    const minStock = row.min_stock != null ? Number(row.min_stock) : null;
    const maxStock = row.max_stock != null ? Number(row.max_stock) : null;

    const isLow = minStock != null && stock < minStock;
    const isHigh = maxStock != null && stock > maxStock;

    const tr = document.createElement('tr');
    tr.dataset.id = row.item_id;
    if (isLow) tr.classList.add('row-low');
    if (isHigh) tr.classList.add('row-high');

    tr.innerHTML = `
        <td>${row.item_id}</td>
        <td data-field="product_name">${row.product_name}</td>
        <td data-field="serial_number">${row.serial_number}</td>
        <td data-field="brand">${row.brand}</td>
        <td data-field="stock">${row.stock}</td>
        <td data-field="min_stock">${row.min_stock ?? '—'}</td>
        <td data-field="max_stock">${row.max_stock ?? '—'}</td>
        <td data-field="cost">${row.cost}</td>
        <td data-field="owner">${row.owner}</td>
        <td>${row.vendor_name ?? '—'}</td>
        <td data-field="location">${row.location ?? ''}</td>
        <td>
            <button class="btn btn-sm btn-outline-primary btn-edit"><i class="bi bi-pencil"></i></button>
            <button class="btn btn-sm btn-success btn-save d-none"><i class="bi bi-check-lg"></i></button>
            <button class="btn btn-sm btn-outline-secondary btn-cancel d-none"><i class="bi bi-x-lg"></i></button>
        </td>
    `;
    return tr;
}

function renderTable(data) {
    const tbody = document.getElementById('tabla-body');
    tbody.innerHTML = '';
    document.getElementById('row-count').textContent = `Showing ${data.length} items`;

    if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="12" class="text-center py-4 text-muted">
            <i class="bi bi-inbox fs-1 d-block mb-2"></i>No items found
        </td></tr>`;
        return;
    }

    data.forEach(row => tbody.appendChild(displayRow(row)));
}

function applyFilters() {
    const product = document.getElementById('f-product').value.toLowerCase();
    const vendor = document.getElementById('f-vendor').value.toLowerCase();
    const owner = document.getElementById('f-owner').value.toLowerCase();
    const stockMin = parseFloat(document.getElementById('f-stock-min').value);
    const stockMax = parseFloat(document.getElementById('f-stock-max').value);
    const costMin = parseFloat(document.getElementById('f-cost-min').value);
    const costMax = parseFloat(document.getElementById('f-cost-max').value);

    const filtered = allStock.filter(r => {
        if (product && !r.product_name.toLowerCase().includes(product)) return false;
        if (vendor && !(r.vendor_name ?? '').toLowerCase().includes(vendor)) return false;
        if (owner && !r.owner.toLowerCase().includes(owner)) return false;
        if (!isNaN(stockMin) && r.stock < stockMin) return false;
        if (!isNaN(stockMax) && r.stock > stockMax) return false;
        if (!isNaN(costMin) && r.cost < costMin) return false;
        if (!isNaN(costMax) && r.cost > costMax) return false;
        return true;
    });

    renderTable(filtered);
}

['f-product','f-vendor','f-owner','f-stock-min','f-stock-max','f-cost-min','f-cost-max'].forEach(id => {
    document.getElementById(id).addEventListener('input', applyFilters);
});

document.getElementById('f-clear').addEventListener('click', () => {
    document.querySelectorAll('.card input').forEach(i => i.value = '');
    renderTable(allStock);
});

document.getElementById('tabla-body').addEventListener('click', async (e) => {
    const tr = e.target.closest('tr');
    if (!tr) return;
    const id = tr.dataset.id;

    if (e.target.closest('.btn-edit')) {
        tr.querySelectorAll('td[data-field]').forEach(td => {
            const field = td.dataset.field;
            const value = td.textContent.trim() === '—' ? '' : td.textContent.trim();
            const type = (field === 'stock' || field === 'min_stock' || field === 'max_stock' || field === 'cost') ? 'number' : 'text';
            td.dataset.original = value;
            td.innerHTML = `<input type="${type}" class="form-control form-control-sm" value="${value}">`;
        });
        tr.querySelector('.btn-edit').classList.add('d-none');
        tr.querySelector('.btn-save').classList.remove('d-none');
        tr.querySelector('.btn-cancel').classList.remove('d-none');
    }

    if (e.target.closest('.btn-cancel')) {
        tr.querySelectorAll('td[data-field]').forEach(td => {
            td.textContent = td.dataset.original || '—';
        });
        tr.querySelector('.btn-edit').classList.remove('d-none');
        tr.querySelector('.btn-save').classList.add('d-none');
        tr.querySelector('.btn-cancel').classList.add('d-none');
    }

    if (e.target.closest('.btn-save')) {
        const payload = {};
        tr.querySelectorAll('td[data-field]').forEach(td => {
            const field = td.dataset.field;
            const input = td.querySelector('input');
            payload[field] = input.type === 'number' ? Number(input.value) : input.value;
        });

        try {
            const res = await fetch(`/stock/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();

            if (!res.ok) {
                alert(data.error || 'Could not save changes');
                return;
            }

            loadStock();
        } catch {
            alert('Could not reach the server');
        }
    }
});

async function loadStock() {
    try {
        const res = await fetch('/stock');
        allStock = await res.json();
        applyFilters();
    } catch {
        document.getElementById('tabla-body').innerHTML =
            '<tr><td colspan="12" class="text-center text-danger">Error al cargar datos</td></tr>';
    }
}

loadStock();
</script>

</body>
</html>
