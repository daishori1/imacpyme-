<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container py-9">
    <h1 class="mb-4">Stock</h1>

  <table class="table table-striped table-hover">
    <thead>
        <tr>
            <th>ID</th>
            <th>Product Name</th>
            <th>Serial Number</th>
            <th>Brand</th>
            <th>Stock</th>
            <th>Cost</th>
            <th>Owner</th>
            <th>Location</th>
            <th>Create Date</th>
        </tr>
    </thead>
    <tbody id="tabla-body">
        <tr><td colspan="9" class="text-center">Cargando...</td></tr>
    </tbody>
</table>

</div>

<script>
    fetch('/stock')
        .then(res => res.json())
        .then(data => {
            const tbody = document.getElementById('tabla-body');
            tbody.innerHTML = '';

            data.forEach(row => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${row.item_id}</td>
                    <td>${row.product_name}</td>
                    <td>${row.serial_number}</td>
                    <td>${row.brand}</td>
                    <td>${row.stock}</td>
                    <td>${row.cost}</td>
                    <td>${row.owner}</td>
                    <td>${row.location}</td>
                    <td>${row.create_at}</td>
                `;
                tbody.appendChild(tr);
            });
        })
        .catch(() => {
            document.getElementById('tabla-body').innerHTML =
                '<tr><td colspan="5" class="text-center text-danger">Error al cargar datos</td></tr>';
        });
</script>

</body>
</html>
